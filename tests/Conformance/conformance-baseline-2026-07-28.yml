# Expected conformance failures for spec revision 2026-07-28.
#
# Separate from conformance-baseline.yml because the two revisions exercise
# different lifecycles against different endpoints: the dated baseline covers
# the handshake era served at /, this one covers the modern (SEP-2575) era
# served at /stateless.
#
# Entries are per-check (scenario:check-id) rather than whole scenarios, so a
# scenario that is mostly conformant keeps reporting the parts that work and a
# new regression inside it still fails the run.
#
# Run with:
#   make conformance-draft-server
#
# server-stateless is deliberately absent: the SEP-2575 lifecycle itself passes
# in full (28 checks, 2 SHOULD-level skips for list-changed notifications the
# fixture does not declare).

server:
  # --- SEP-2549: cache hints -------------------------------------------------
  # 2026-07-28 requires every list/read result to carry cacheScope and ttlMs.
  # The SDK's result types predate the requirement and emit neither.
  - caching:sep-2549-tools-list-caching-hints
  - caching:sep-2549-prompts-list-caching-hints
  - caching:sep-2549-resources-list-caching-hints
  - caching:sep-2549-resources-templates-list-caching-hints
  - caching:sep-2549-resources-read-caching-hints
  - caching:sep-2549-ttl-non-negative
  - caching:sep-2549-cache-scope-valid

  # --- Universal `resultType` ------------------------------------------------
  # Every 2026-07-28 result must carry a `resultType` discriminator; the SDK's
  # Result classes do not yet emit one, so schema validation rejects otherwise
  # correct payloads. One root cause, one fix, ~20 checks.
  - caching:wire-schema-valid
  - completion-complete:wire-schema-valid
  - http-custom-header-server-validation:wire-schema-valid
  - http-header-validation:wire-schema-valid
  - input-required-result-unsupported-methods:wire-schema-valid
  - json-schema-2020-12:wire-schema-valid
  - prompts-get-simple:wire-schema-valid
  - prompts-get-with-args:wire-schema-valid
  - prompts-list:wire-schema-valid
  - resources-list:wire-schema-valid
  - resources-read-binary:wire-schema-valid
  - resources-read-text:wire-schema-valid
  - resources-templates-read:wire-schema-valid
  - tools-call-audio:wire-schema-valid
  - tools-call-embedded-resource:wire-schema-valid
  - tools-call-error:wire-schema-valid
  - tools-call-image:wire-schema-valid
  - tools-call-mixed-content:wire-schema-valid
  - tools-call-simple-text:wire-schema-valid
  - tools-list:wire-schema-valid

  # --- SEP-2243: standard HTTP headers ---------------------------------------
  # Mcp-Method / Mcp-Name validation and the X-MCP-* rules are unimplemented.
  - http-header-validation:sep-2243-server-reject-invalid-headers
  - http-custom-header-server-validation:sep-2243-server-no-xmcp-tool
  - http-custom-header-server-validation:sep-2243-server-decode-base64
  - http-custom-header-server-validation:sep-2243-server-validate-param-match
  - http-custom-header-server-validation:sep-2243-server-reject-invalid-param-chars
  - http-custom-header-server-validation:sep-2243-server-reject-param-mismatch

  # --- SEP-2322: MRTR round trips --------------------------------------------
  # InputRequiredResult exists and tools/call can answer with one (that is what
  # makes server-stateless green), but the retry half is not implemented: the
  # SDK does not consume inputResponses, verify requestState integrity, or
  # resume a call from it. Fixing this is the natural next chunk.
  - input-required-result-basic-elicitation:sep-2322-elicitation-incomplete
  - input-required-result-basic-list-roots:sep-2322-list-roots-incomplete
  - input-required-result-basic-sampling:sep-2322-sampling-incomplete
  - input-required-result-capability-check:sep-2322-respect-client-capabilities
  - input-required-result-multi-round:sep-2322-multi-round-r1
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete
  - input-required-result-non-tool-request:sep-2322-non-tool-incomplete
  - input-required-result-request-state:sep-2322-request-state-incomplete
  - input-required-result-result-type:sep-2322-result-type-included
  - input-required-result-tampered-state:sep-2322-reject-tampered-state

  # --- SHOULD-level warnings -------------------------------------------------
  # These report WARNING rather than FAILURE (the severity follows the spec
  # keyword), so the run summary counts them as passed — but the baseline
  # evaluator still wants them declared, and declaring them is right: each is a
  # SHOULD the SDK does not yet honour.
  - http-header-validation:sep-2243-server-reject-error-code
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
  - input-required-result-missing-input-response:sep-2322-missing-response-rerequests
  - sep-2164-resource-not-found:sep-2164-data-uri
  - sep-2164-resource-not-found:sep-2164-error-code

  # --- Pre-existing, not lifecycle-specific ----------------------------------
  # These fail identically on the handshake endpoint and are unrelated to
  # SEP-2575; they are listed so the draft run is honest, not to excuse them.
  - dns-rebinding-protection:localhost-host-rebinding-rejected
  - json-schema-2020-12:json-schema-2020-12-tool-found
  - prompts-get-embedded-resource:prompts-get-embedded-resource
  - prompts-get-with-image:prompts-get-with-image
  - tools-call-with-progress:tools-call-with-progress

client: []
